[advisories]
yanked = "deny"
# `ttf-parser` is transitively required by cosmic-text/fontdb and ab_glyph.
# RUSTSEC-2026-0192 reports that it is unmaintained, not a known vulnerability,
# and currently lists no safe upgrade. Remove this exact exception when the
# renderer moves fully to a maintained skrifa/fontations-based stack.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
