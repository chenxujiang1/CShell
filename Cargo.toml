[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "cli",
    "daemon",
    "crates/cshell-application",
    "crates/cshell-import",
    "crates/cshell-theme",
    "crates/cshell-highlight",
    "crates/cshell-automation",
    "crates/cshell-script-runtime",
    "crates/cshell-script-worker",
    "crates/cshell-domain",
    "crates/cshell-ipc",
    "crates/cshell-local",
    "crates/cshell-output-store",
    "crates/cshell-render",
    "crates/cshell-sftp",
    "crates/cshell-storage",
    "crates/cshell-ssh",
    "crates/cshell-terminal",
    "crates/cshell-ui",
    "crates/cshell-vault",
    "xtask",
    "vendor/alacritty_terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
ab_glyph = "=0.2.32"
alacritty_terminal = { version = "=0.26.0", default-features = false }
async-trait = "0.1"
bytemuck = { version = "=1.25.2", features = ["derive"] }
bytes = "1"
crc32fast = "1"
cosmic-text = "=0.19.0"
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["alloc", "zeroize"] }
egui = "=0.36.1"
egui-wgpu = "=0.36.1"
egui-winit = "=0.36.1"
epaint_default_fonts = "=0.36.1"
futures = "0.3"
guillotiere = "=0.7.0"
hmac = "0.13"
libc = "=0.2.189"
keyring = "=4.2.0"
memchr = "2"
portable-pty = "=0.9.0"
prost = "=0.14.4"
rand = "=0.10.2"
regex = "=1.13.1"
ring = "=0.17.14"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
russh = { version = "=0.63.1", default-features = false, features = ["ring"] }
russh-sftp = "=3.0.0"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "=0.11.0"
ssh-cipher = { version = "=0.3.0", default-features = false, features = ["aes", "zeroize"] }
ssh-encoding = { version = "=0.3.0", default-features = false, features = ["alloc", "base64", "zeroize"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "=1.26.0", features = ["serde", "v7"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
wgpu = "=30.0.1"
winit = "=0.30.13"
windows-sys = "=0.61.2"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
await_holding_lock = "deny"

[profile.dev]
# Keep local build/test storage bounded; use line tables for backtraces.
incremental = false
debug = 1

[profile.dev.package.'*']
debug = 1

[profile.test]
incremental = false
debug = 1

[profile.test.package.'*']
debug = 1

[profile.ci-local]
inherits = 'test'
incremental = false
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
debug = true

[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
